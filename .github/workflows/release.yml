name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build NSIS installer
        # 不传 -c.publish：electron-builder 在无 GH_TOKEN 时不会自动发布，
        # 由后面的 action 统一上传。注意 -c.publish=never 是错误写法，
        # 那会被当成 provider 名称去找模块，直接报 "Cannot find module for publisher never"
        # 不设置 ELECTRON_MIRROR：runner 在海外，官方源比国内镜像快
        # CSC_IDENTITY_AUTO_DISCOVERY=false：CI 无代码签名证书，显式关闭避免签名环节报错
        shell: bash
        run: |
          set -o pipefail
          npx electron-builder --win nsis 2>&1 | tee build.log
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Show build log on failure
        if: failure()
        shell: bash
        run: tail -n 80 build.log || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release/*.exe
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          generate_release_notes: true
          draft: false
